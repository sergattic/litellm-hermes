# Example. Keys come from the environment (.env), never from this file.
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: false          # this file stays the source of truth

litellm_settings:
  callbacks: quota_router.quota_router   # free-first routing, see callbacks/quota_router.py

# One tool per key, each with a UNIQUE name. Clients call the pool name from quota_pools.yaml.
search_tools:
  - search_tool_name: tavily-free-1
    litellm_params: {search_provider: tavily, api_key: os.environ/TAVILY_API_KEY_1}
  - search_tool_name: tavily-free-2
    litellm_params: {search_provider: tavily, api_key: os.environ/TAVILY_API_KEY_2}
  - search_tool_name: exa-paid
    litellm_params: {search_provider: exa_ai, api_key: os.environ/EXA_API_KEY}

# Move a request to the next tool in the same call when one fails (quota, outage).
# Keep in sync with quota_pools.yaml: `python scripts/gen_fallbacks.py` prints the block.
router_settings:
  fallbacks:
    - {tavily-free-1: [tavily-free-2, exa-paid]}
    - {tavily-free-2: [exa-paid]}
